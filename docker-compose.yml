services:
  api:
    build: ./backend
    environment:
      BMRS_BASE_URL: ${BMRS_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-21600}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
